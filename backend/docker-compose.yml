version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: weather_advisory_backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://gisuser:gispass@postgis:5432/weather_gis
    depends_on:
      - postgis
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.4
    container_name: weather_postgis
    environment:
      POSTGRES_USER: gisuser
      POSTGRES_PASSWORD: gispass
      POSTGRES_DB: weather_gis
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis_data:
